name: bretune_transfer
description: Secure local-network file transfer for Windows and Android.
publish_to: none
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  bonsoir: ^6.0.1
  crypto: ^3.0.3
  file_picker: ^8.0.7
  http: ^1.2.2
  path: ^1.9.0
  path_provider: ^2.1.4
  mobile_scanner: ^5.2.3
  permission_handler: ^11.4.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_full.png
    - assets/images/logo_icon.png
